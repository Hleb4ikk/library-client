<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test Page</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c5f2d;
            margin-top: 0;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: 600;
        }
        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        button {
            background: #ff8c42;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 5px;
        }
        button:hover {
            background: #e67a35;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .log-container {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
        }
        .log-entry.info { color: #4fc3f7; }
        .log-entry.success { color: #81c784; }
        .log-entry.error { color: #e57373; }
        .log-entry.warning { color: #ffb74d; }
        .controls {
            margin: 20px 0;
        }
        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            width: 200px;
            margin-right: 10px;
        }
        .indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .indicator.green { background: #4caf50; }
        .indicator.red { background: #f44336; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔌 WebSocket Test Page</h1>
        
        <div id="status" class="status disconnected">
            <span class="indicator red"></span>
            Статус: Отключен
        </div>

        <div class="controls">
            <h3>Управление соединением</h3>
            <button onclick="connectWS()">Подключиться</button>
            <button onclick="disconnectWS()">Отключиться</button>
            <button onclick="clearLogs()">Очистить логи</button>
        </div>

        <div class="controls">
            <h3>Тестирование комнат</h3>
            <input type="text" id="bookId" placeholder="Book ID (например, OL123W)" value="OL45883W">
            <button onclick="joinRoom()">Присоединиться</button>
            <button onclick="leaveRoom()">Покинуть</button>
        </div>

        <div class="controls">
            <h3>Симуляция событий</h3>
            <button onclick="simulateLike()">Симулировать лайк</button>
        </div>

        <div class="log-container" id="logs">
            <div class="log-entry info">Ожидание подключения...</div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        let socket = null;
        let currentRoom = null;

        function addLog(message, type = 'info') {
            const logsContainer = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.textContent = `[${timestamp}] ${message}`;
            logsContainer.appendChild(logEntry);
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }

        function updateStatus(connected) {
            const statusDiv = document.getElementById('status');
            const indicator = statusDiv.querySelector('.indicator');
            
            if (connected) {
                statusDiv.className = 'status connected';
                indicator.className = 'indicator green';
                statusDiv.innerHTML = '<span class="indicator green"></span>Статус: Подключен (ID: ' + socket.id + ')';
            } else {
                statusDiv.className = 'status disconnected';
                indicator.className = 'indicator red';
                statusDiv.innerHTML = '<span class="indicator red"></span>Статус: Отключен';
            }
        }

        function connectWS() {
            if (socket && socket.connected) {
                addLog('Уже подключен!', 'warning');
                return;
            }

            const url = 'http://localhost:8080';
            addLog(`Подключение к ${url}...`, 'info');

            socket = io(url, {
                transports: ['websocket', 'polling'],
                reconnection: true
            });

            socket.on('connect', () => {
                addLog('✓ Подключено успешно!', 'success');
                updateStatus(true);
            });

            socket.on('disconnect', (reason) => {
                addLog(`✗ Отключено: ${reason}`, 'error');
                updateStatus(false);
            });

            socket.on('connect_error', (error) => {
                addLog(`✗ Ошибка подключения: ${error.message}`, 'error');
                updateStatus(false);
            });

            socket.on('likes:updated', (payload) => {
                addLog(`📢 Получено обновление лайков для ${payload.book_olid}: ${payload.count}`, 'success');
            });
        }

        function disconnectWS() {
            if (!socket) {
                addLog('Соединение не установлено', 'warning');
                return;
            }

            if (currentRoom) {
                leaveRoom();
            }

            socket.disconnect();
            addLog('Отключение...', 'info');
            updateStatus(false);
        }

        function joinRoom() {
            if (!socket || !socket.connected) {
                addLog('Сначала подключитесь к WebSocket!', 'error');
                return;
            }

            const bookId = document.getElementById('bookId').value.trim();
            if (!bookId) {
                addLog('Введите Book ID!', 'error');
                return;
            }

            if (currentRoom) {
                leaveRoom();
            }

            socket.emit('join_book_channel', bookId);
            currentRoom = bookId;
            addLog(`→ Присоединение к комнате: book:${bookId}`, 'info');
        }

        function leaveRoom() {
            if (!socket || !currentRoom) {
                addLog('Вы не в комнате', 'warning');
                return;
            }

            socket.emit('leave_book_channel', currentRoom);
            addLog(`← Покидание комнаты: book:${currentRoom}`, 'info');
            currentRoom = null;
        }

        function simulateLike() {
            if (!currentRoom) {
                addLog('Сначала присоединитесь к комнате!', 'error');
                return;
            }

            const randomCount = Math.floor(Math.random() * 100);
            addLog(`🧪 Симуляция: отправка likes:updated с count=${randomCount}`, 'warning');
            
            // Эмулируем получение события
            setTimeout(() => {
                if (socket && socket.connected) {
                    socket.emit('likes:updated', {
                        book_olid: currentRoom,
                        count: randomCount
                    });
                }
            }, 500);
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '<div class="log-entry info">Логи очищены</div>';
        }

        // Автоподключение при загрузке
        window.addEventListener('load', () => {
            addLog('Страница загружена. Нажмите "Подключиться" для начала теста.', 'info');
        });
    </script>
</body>
</html>
