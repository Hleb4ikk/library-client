services:
  library-redis:
    image: redis:7-alpine
    container_name: library-redis
    command: redis-server --requirepass my_secure_password
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  server:
    build:
      context: ./server
    container_name: library-server
    env_file:
      - ./server/.env
    environment:
      # Внутри сети compose обращаемся к redis по имени сервиса
      REDIS_URL: redis://default:my_secure_password@library-redis:6379
      # Разрешаем CORS-запросы от клиента
      CLIENT_URL: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      - library-redis
    restart: unless-stopped

  email-worker:
    build:
      context: ./email-worker
    container_name: library-email-worker
    env_file:
      - ./email-worker/.env
    environment:
      # Внутри сети compose обращаемся к redis по имени сервиса
      REDIS_URL: redis://default:my_secure_password@library-redis:6379
    depends_on:
      - library-redis
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        # URL API, который попадёт в сборку фронтенда
        VITE_API_URL: http://localhost:8080/api
    container_name: library-client
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  redis-data:
